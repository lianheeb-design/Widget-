name: Release

# Baut die Windows-Installer und veröffentlicht sie als GitHub-Release, sobald
# ein Versions-Tag (z. B. v0.5.1) hochgeladen wird. Das macht
# UPDATE-VEROEFFENTLICHEN.bat. Die `latest.json` im Release ist das, was die
# installierten Apps abfragen, um Updates zu finden.
#
# Nötig sind die Repository-Secrets TAURI_SIGNING_PRIVATE_KEY und
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD (UPDATES-EINRICHTEN.bat führt durch).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      # Installs the toolchain pinned in src-tauri/rust-toolchain.toml.
      - name: Install Rust
        working-directory: src-tauri
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signiert die Updates; die App prüft sie mit `plugins.updater.pubkey`
          # in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: bun tauri
          tagName: v__VERSION__
          releaseName: Dynamic Island (Deutsch) v__VERSION__
          releaseBody: |
            Zum Installieren die Datei herunterladen, die auf `_x64-setup.exe` endet, und doppelklicken.
            Wer die App schon hat, bekommt das Update in der Insel angeboten.
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          releaseDraft: false
          prerelease: false
